name: Deploy File Compression Agent

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/fileCompressionAgent/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deployFileCompressionAgent.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build file compression agent
        run: npm run build --workspace=nukleio-file-compression-agent

      - name: Prepare deployment package
        run: |
          rm -rf apps/fileCompressionAgent/package apps/fileCompressionAgent/function.zip
          mkdir -p apps/fileCompressionAgent/package
          cp -r apps/fileCompressionAgent/dist/* apps/fileCompressionAgent/package/
          cp apps/fileCompressionAgent/package.json apps/fileCompressionAgent/package/
          cd apps/fileCompressionAgent/package
          npm install --omit=dev --no-package-lock --os=linux --cpu=x64
          zip -r ../function.zip .

      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
          function_name: ${{ github.ref_name == 'main' && 'Nukleio-File-Compression-Agent' || 'Nukleio-File-Compression-Agent-Dev' }}
          zip_file: apps/fileCompressionAgent/function.zip
          runtime: nodejs24.x
          handler: index.handler
          memory_size: 2048
          timeout: 90

      - name: Configure AWS credentials for security verification
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify Function URL requires AWS IAM
        shell: bash
        env:
          FUNCTION_NAME: ${{ github.ref_name == 'main' && 'Nukleio-File-Compression-Agent' || 'Nukleio-File-Compression-Agent-Dev' }}
        run: |
          auth_type="$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" --query AuthType --output text)"
          if [ "$auth_type" != "AWS_IAM" ]; then
            echo "::error::${FUNCTION_NAME} Function URL auth type is ${auth_type}; expected AWS_IAM"
            exit 1
          fi
